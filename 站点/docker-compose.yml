services:
  portal:
    image: nginx:1.27-alpine
    container_name: portal
    restart: unless-stopped
    ports:
      # 只被 NPM 反代（172.17.0.1:8081），不对公网开放时可在安全组封禁 8081
      - "8081:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    healthcheck:
      # busybox wget：只取响应头，不落盘
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
