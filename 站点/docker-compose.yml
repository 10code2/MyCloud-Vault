services:
  portal:
    image: nginx:1.27-alpine
    container_name: portal
    restart: unless-stopped
    # 不发布宿主机端口：直接加入 NPM 所在网络，由 NPM 用容器名 portal:80 反代。
    # 这样既不需要 8081，也不依赖 172.17.0.1（该地址在 docker0 无容器时会不可达）。
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    networks:
      - npm_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  # 复用 NPM 的 compose 网络（docker network ls 可见 npm_default）
  npm_net:
    external: true
    name: npm_default
